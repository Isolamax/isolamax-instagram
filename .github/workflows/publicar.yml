# Publica no Instagram da Isolamax os posts aprovados da fila.json cuja hora chegou.
# Roda a cada 15 min (o GitHub pode atrasar alguns minutos em horário de pico).
name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
    # Reforço perto dos horários dos posts (11:30, 12:00 e 12:15 de Brasília = 14:30 a 15:15 UTC):
    # o GitHub tem pulado boa parte das rodadas de 15 em 15 min (em 20/10 rodou só 5 vezes).
    - cron: "7,22,37,52 14-16,18,20-21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publicar o que chegou na hora
        id: publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publicar.py

      - name: Gravar a fila
        if: always()
        run: |
          if ! git diff --quiet fila.json; then
            git config user.name "isolamax-publicador"
            git config user.email "isolamax-publicador@users.noreply.github.com"
            git add fila.json
            git commit -m "Fila: status atualizado pela rodada de publicação"
            git push
          fi

      - name: Avisar o dono se algo falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Instagram: post com problema ($(date -u +%d/%m\ %H:%M) UTC)" \
            --body "A rodada de publicação falhou. Veja o status e o campo obs em fila.json e o log em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
